<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sa-Khon · Supabase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green-900: #14532d;
        --green-800: #166534;
        --green-700: #15803d;
        --green-600: #16a34a;
        --green-500: #22c55e;
        --green-100: #dcfce7;
        --green-50: #f0fdf4;
        --white: #ffffff;
        --ink: #14532d;
        --muted: #4d7c5a;
        --err: #991b1b;
        --err-bg: #fef2f2;
        --shadow: 0 18px 50px rgba(20, 83, 45, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Sarabun", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 500px at 10% -10%, #bbf7d0 0%, transparent 55%),
          radial-gradient(900px 420px at 100% 0%, #86efac 0%, transparent 45%),
          linear-gradient(180deg, var(--green-50) 0%, var(--white) 48%, #ecfdf5 100%);
      }

      .leaf {
        position: fixed;
        border-radius: 50%;
        background: rgba(34, 197, 94, 0.12);
        pointer-events: none;
      }

      .leaf-a {
        width: 280px;
        height: 280px;
        top: 12%;
        right: -80px;
      }

      .leaf-b {
        width: 180px;
        height: 180px;
        bottom: 8%;
        left: -50px;
      }

      .page {
        position: relative;
        max-width: 760px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 1.75rem;
      }

      .logo {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(145deg, var(--green-500), var(--green-800));
        color: var(--white);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.15rem;
        box-shadow: 0 10px 24px rgba(22, 163, 74, 0.35);
      }

      .brand-title {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand-sub {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .hero {
        background: var(--white);
        border: 1px solid rgba(22, 163, 74, 0.14);
        border-radius: 28px;
        padding: 1.75rem 1.6rem 1.5rem;
        box-shadow: var(--shadow);
      }

      h1 {
        font-size: clamp(1.6rem, 4vw, 2.05rem);
        line-height: 1.25;
        margin-bottom: 0.45rem;
      }

      .lead {
        color: var(--muted);
        margin-bottom: 1.35rem;
        font-size: 1.02rem;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        margin: 1.15rem 0 0;
      }

      #test-btn {
        appearance: none;
        border: 0;
        cursor: pointer;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--white);
        background: linear-gradient(145deg, var(--green-500), var(--green-800));
        padding: 0.85rem 1.6rem;
        min-width: 140px;
        border-radius: 999px;
        box-shadow: 0 10px 22px rgba(22, 163, 74, 0.32);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }

      #test-btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      #test-btn:active {
        transform: translateY(1px);
      }

      #test-btn:disabled {
        cursor: wait;
        filter: grayscale(0.15);
        opacity: 0.75;
        transform: none;
      }

      #status {
        display: flex;
        gap: 0.9rem;
        align-items: flex-start;
        padding: 1rem 1.05rem;
        border-radius: 18px;
        background: var(--green-50);
        border: 1px solid rgba(22, 163, 74, 0.18);
        font-weight: 500;
      }

      #status .dot {
        width: 12px;
        height: 12px;
        margin-top: 0.4rem;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--green-500);
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18);
        animation: pulse 1.4s ease-in-out infinite;
      }

      #status.ok {
        background: linear-gradient(90deg, #dcfce7, #f0fdf4);
        border-color: rgba(22, 163, 74, 0.28);
      }

      #status.ok .dot {
        animation: none;
        background: var(--green-700);
      }

      #status.err {
        background: var(--err-bg);
        border-color: #fecaca;
        color: var(--err);
      }

      #status.err .dot {
        animation: none;
        background: #dc2626;
        box-shadow: 0 0 0 6px rgba(220, 38, 38, 0.12);
      }

      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.85rem;
        margin-top: 1.15rem;
      }

      .chip {
        background: var(--green-50);
        border: 1px solid rgba(22, 163, 74, 0.12);
        border-radius: 16px;
        padding: 0.85rem 1rem;
      }

      .chip span {
        display: block;
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 0.2rem;
      }

      .chip strong {
        font-size: 0.95rem;
        word-break: break-all;
        font-weight: 600;
      }

      footer {
        margin-top: 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.85);
          opacity: 0.55;
        }
      }

      @media (max-width: 640px) {
        .meta {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="leaf leaf-a"></div>
    <div class="leaf leaf-b"></div>

    <div class="page">
      <header>
        <div class="logo" aria-hidden="true">SK</div>
        <div>
          <p class="brand-title">Sa-Khon</p>
          <p class="brand-sub">เชื่อมฐานข้อมูลกับ Supabase</p>
        </div>
      </header>

      <main class="hero">
        <h1>สถานะการเชื่อมต่อ</h1>
      

        <p id="status">
          <span class="dot" aria-hidden="true"></span>
          <span>กดปุ่ม Test เพื่อตรวจสอบการเชื่อมต่อ</span>
        </p>

        <div class="actions">
          <button type="button" id="test-btn">Test</button>
        </div>

        <div class="meta">
          <div class="chip">
            <span>Project ID</span>
            <strong>hsfgltxraiyskdjgxqba</strong>
          </div>
          <div class="chip">
            <span>Region</span>
            <strong>ap-southeast-1 · Singapore</strong>
          </div>
        </div>
      </main>

      <footer>พร้อมใช้งานเมื่อสถานะเป็นสีเขียว</footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config/database.js"></script>
    <script>
      (function () {
        const status = document.getElementById("status");
        const testBtn = document.getElementById("test-btn");

        function setStatus(kind, message) {
          status.className = kind;
          status.innerHTML =
            '<span class="dot" aria-hidden="true"></span><span></span>';
          status.lastElementChild.textContent = message;
        }

        async function runTest() {
          testBtn.disabled = true;
          setStatus("", "กำลังเชื่อมต่อ...");

          try {
            const supabase = window.createSupabaseClient();
            const { error } = await supabase
              .from("_connection_check")
              .select("*")
              .limit(1);

            const missingTable =
              error &&
              (error.code === "42P01" ||
                /could not find the table|schema cache/i.test(error.message || ""));

            if (missingTable) {
              setStatus(
                "ok",
                "เชื่อมต่อ Supabase สำเร็จ "
              );
            } else if (error && (error.message || "").toLowerCase().includes("jwt")) {
              setStatus("err", "คีย์หรือ URL ไม่ถูกต้อง: " + error.message);
            } else if (error) {
              setStatus("ok", "เชื่อมต่อเซิร์ฟเวอร์ Supabase ได้แล้ว: " + error.message);
            } else {
              setStatus("ok", "เชื่อมต่อและอ่านข้อมูลได้สำเร็จ");
            }
          } catch (err) {
            setStatus("err", err.message);
          } finally {
            testBtn.disabled = false;
          }
        }

        testBtn.addEventListener("click", runTest);
      })();
    </script>
  </body>
</html>
