<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#labels,#hud,#prompt,#toastbox,#panel,#mgui,#touch,#menu,#quest{position:absolute;pointer-events:none}
#labels{inset:0}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:calc(var(--s)*5.1px);font-weight:600;
 background:rgba(10,14,22,.84);border:calc(var(--s)*.8px) solid #ffd86b;color:#ffe9a8;
 padding:calc(var(--s)*1.1px) calc(var(--s)*2.8px);border-radius:calc(var(--s)*2px);text-shadow:0 calc(var(--s)*.6px) 0 #000}
.lbl.soft{border-color:#7fd0ff;color:#dff2ff}
.lbl.door{border-color:#9ef0a8;color:#dbffe1}
.lbl.field{border-color:#b6ff8a;color:#e6ffd6}
#hud{left:calc(var(--s)*5px);top:calc(var(--s)*5px);display:flex;flex-wrap:wrap;gap:calc(var(--s)*2.3px);
 font-size:calc(var(--s)*5.5px);font-weight:600;max-width:calc(var(--s)*316px)}
.chip{background:rgba(9,13,20,.86);border:calc(var(--s)*.8px) solid #35527d;border-radius:calc(var(--s)*2.4px);
 padding:calc(var(--s)*1.2px) calc(var(--s)*3px);display:flex;align-items:center;gap:calc(var(--s)*1.5px);text-shadow:0 1px 0 #000}
.chip b{color:#ffd86b;font-weight:800}
.chip.place{border-color:#7fd0ff;color:#dff2ff}
#quest{left:calc(var(--s)*5px);top:calc(var(--s)*26px);font-size:calc(var(--s)*5.1px);font-weight:600;
 background:rgba(9,13,20,.86);border-left:calc(var(--s)*2px) solid #ffd86b;border-radius:calc(var(--s)*2px);
 padding:calc(var(--s)*1.5px) calc(var(--s)*3.2px);color:#ffe9a8;max-width:calc(var(--s)*214px)}
#prompt{left:50%;bottom:calc(var(--s)*9px);transform:translateX(-50%);font-size:calc(var(--s)*6.1px);font-weight:600;
 background:rgba(7,11,17,.92);border:calc(var(--s)*1px) solid #ffd86b;border-radius:calc(var(--s)*3px);
 padding:calc(var(--s)*2px) calc(var(--s)*5px);white-space:nowrap;opacity:0;transition:opacity .12s}
#prompt.on{opacity:1}
#prompt kbd{background:#ffd86b;color:#2b1d06;border-radius:calc(var(--s)*1.4px);padding:0 calc(var(--s)*2px);font-weight:800;font-family:inherit}
#toastbox{right:calc(var(--s)*5px);top:calc(var(--s)*5px);display:flex;flex-direction:column;gap:calc(var(--s)*2px);align-items:flex-end}
.toast{font-size:calc(var(--s)*5.1px);font-weight:600;background:rgba(7,11,17,.92);border-left:calc(var(--s)*2px) solid #6ee27a;
 padding:calc(var(--s)*1.8px) calc(var(--s)*3.8px);border-radius:calc(var(--s)*2px);animation:tin .28s ease}
.toast.bad{border-left-color:#ff6b6b}
@keyframes tin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
#panel{inset:0;display:none;place-items:center;background:rgba(3,5,9,.74);pointer-events:auto}
#panel.on{display:grid}
.pbox{width:calc(var(--s)*342px);max-height:calc(var(--s)*236px);overflow:auto;background:#111a26;
 border:calc(var(--s)*1.4px) solid #ffd86b;border-radius:calc(var(--s)*4px);box-shadow:0 calc(var(--s)*4px) 0 #090e15}
.ptitle{font-size:calc(var(--s)*7.3px);font-weight:800;color:#2b1d06;background:linear-gradient(#ffd86b,#e9b53a);
 padding:calc(var(--s)*2.2px) calc(var(--s)*5px);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.pbody{padding:calc(var(--s)*4px);display:flex;flex-direction:column;gap:calc(var(--s)*2.2px)}
.row{display:flex;align-items:center;gap:calc(var(--s)*3px);background:#1a2534;border:calc(var(--s)*.8px) solid #2f4460;
 border-radius:calc(var(--s)*2.4px);padding:calc(var(--s)*2.2px) calc(var(--s)*3.2px)}

 background:linear-gradient(#ffe291,#e9b53a);border:none;border-bottom:calc(var(--s)*2px) solid #a97d18;
 border-radius:calc(var(--s)*2px);padding:calc(var(--s)*2px) calc(var(--s)*4px);white-space:nowrap}
.btn:active{transform:translateY(calc(var(--s)*1px));border-bottom-width:calc(var(--s)*1px)}
.btn.blue{background:linear-gradient(#a6e3ff,#3fa8dd);border-bottom-color:#1d6f96;color:#062031}
.btn.red{background:linear-gradient(#ff9c9c,#e05353);border-bottom-color:#8f2b2b;color:#2b0606}
.btn.dis{background:#3f4c5a;color:#93a1b2;border-bottom-color:#28313b;cursor:not-allowed}
.x{cursor:pointer;pointer-events:auto;font-weight:800;font-size:calc(var(--s)*8px);line-height:1}
#mgui{left:50%;top:calc(var(--s)*14px);transform:translateX(-50%);text-align:center;display:none;width:100%}
#mgui.on{display:block}
#mgt{font-size:calc(var(--s)*7.7px);font-weight:800;color:#ffd86b;text-shadow:0 calc(var(--s)*1px) 0 #000}
#mgd{font-size:calc(var(--s)*5.1px);font-weight:600;text-shadow:0 1px 2px #000;opacity:.95}
#touch{inset:0;display:none}#touch.on{display:block}
.pad{position:absolute;pointer-events:auto;background:rgba(255,255,255,.15);border:calc(var(--s)*1px) solid rgba(255,255,255,.32);
 border-radius:calc(var(--s)*3px);display:grid;place-items:center;font-size:calc(var(--s)*7px);color:#fff;font-weight:800}
.pad:active{background:rgba(255,216,107,.5)}
#abtn{position:absolute;pointer-events:auto;right:calc(var(--s)*12px);bottom:calc(var(--s)*17px);
 width:calc(var(--s)*27px);height:calc(var(--s)*27px);border-radius:50%;background:rgba(255,216,107,.88);color:#2b1d06;
 display:grid;place-items:center;font-weight:800;font-size:calc(var(--s)*9px);border:calc(var(--s)*1.2px) solid rgba(255,255,255,.5)}
#menu{right:calc(var(--s)*5px);bottom:calc(var(--s)*5px);pointer-events:auto;display:flex;gap:calc(var(--s)*2px)}
.mb{cursor:pointer;font-size:calc(var(--s)*5.3px);background:rgba(9,13,20,.86);border:calc(var(--s)*.8px) solid #35527d;
 border-radius:calc(var(--s)*2px);padding:calc(var(--s)*1.3px) calc(var(--s)*2.8px);color:#cfe3ff;font-weight:600}
.mb.home{border-color:#9ef0a8;color:#dbffe1}
</style>

<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="480" height="270"></canvas>
  <div id="labels"></div><div id="hud"></div><div id="quest"></div>

<script>
"use strict";
/*=====================================================================
  มาตราส่วน 14px = 1 เมตร | ผู้เล่น "น้องกล้วย" 18x26 | NPC 16x24
=====================================================================*/
const VW=480,VH=270;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage'),labelsEl=document.getElementById('labels');
const hudEl=document.getElementById('hud'),questEl=document.getElementById('quest');
const promptEl=document.getElementById('prompt'),toastBox=document.getElementById('toastbox');
const panelEl=document.getElementById('panel'),ptEl=document.getElementById('pt'),pbEl=document.getElementById('pb');
const mguiEl=document.getElementById('mgui'),mgtEl=document.getElementById('mgt'),mgdEl=document.getElementById('mgd');
function resize(){const s=Math.max(1,Math.min(innerWidth/VW,innerHeight/VH));
 stage.style.width=(VW*s)+'px';stage.style.height=(VH*s)+'px';stage.style.setProperty('--s',s);}
addEventListener('resize',resize);resize();
const cl=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,y){let n=(x*7919+y*104729)|0;n=(n<<13)^n;return((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff;}
function ov(ax,ay,aw,ah,r){return ax<r[0]+r[2]&&ax+aw>r[0]&&ay<r[1]+r[3]&&ay+ah>r[1];}
function mixc(a,b,t){t=cl(t,0,1);return'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}

/*========================= AUDIO =========================*/
let AC=null;
function snd(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,AC.currentTime);
 g.gain.setValueAtTime(v||.045,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={ok:()=>snd(640,.09),door:()=>{snd(320,.07,'square',.04);setTimeout(()=>snd(480,.1),70);},
 pick:()=>{snd(880,.07);setTimeout(()=>snd(1200,.09),70);},coin:()=>{snd(1046,.06);setTimeout(()=>snd(1568,.13),60);},
 bad:()=>snd(150,.19,'sawtooth',.05),plant:()=>snd(400,.11,'triangle',.06),water:()=>snd(760,.08,'sine',.05),
 ripe:()=>{snd(784,.09,'triangle',.05);setTimeout(()=>snd(1175,.14,'triangle',.05),90);}};

/*================= 👩‍🌾 ตัวละครผู้เล่น "น้องกล้วย" =================*/
const PAL={'.':null,o:'#1b1208',k:'#2a1c0d',
 s:'#ffdcb2',S:'#e8b184',c:'#ffeed4',r:'#e05a7a',
 h:'#f6d98a',H:'#d4a94e',y:'#fff0bd',
 n:'#4a2c17',N:'#6b4223',m:'#8a5a2f',
 b:'#6fc3f0',B:'#3f96c9',w:'#fdfdfd',f:'#fff3b0',
 a:'#fff6e2',A:'#e2d3b4',g:'#6fd9a8',G:'#3fa87c',
 t:'#ffd86b',T:'#d9a72f',p:'#7a4f2a',P:'#55341a'};
function mk(rows){const w=Math.max.apply(null,rows.map(r=>r.length)),h=rows.length;
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const q=PAL[rows[j][i]||'.'];if(q){x.fillStyle=q;x.fillRect(i,j,1,1);}}return c;}
function mir(c0){const c=document.createElement('canvas');c.width=c0.width;c.height=c0.height;
 const x=c.getContext('2d');x.translate(c0.width,0);x.scale(-1,1);x.drawImage(c0,0,0);return c;}
const HAT_D=['......oooooo......','....oohhhhhhoo....','...ohyyhhhhyyho...','..ohhhhhhhhhhhho..',
 '.oHHHHHHHHHHHHHHo.','ooHHHHHHHHHHHHHHoo','.oooooooooooooooo.'];
const HAT_U=['......oooooo......','....oohhhhhhoo....','...ohhhhhhhhhho...','..ohhhhhhhhhhhho..',
 '.oHHHHHHHHHHHHHHo.','ooHHHHHHHHHHHHHHoo','.oooooooooooooooo.'];
const FACE_D=['...onnnnnnnnnno...','..onsssssssssno...','..onscsssssscno...','..onsoosssoosno...',
 '..onsooswwoosno...','..onssrsssrssno...','..onsssrrrsssno...','..onnsSSSSSsnno...','...onnNNNNnno.....'];
const FACE_U=['...onnnnnnnnnno...','..onnnnnnnnnnnno..','..onnNNNNNNNNnno..','..onnNNmmmmNNnno..',
 '..onnNNmmmmNNnno..','..onnNNNNNNNNnno..','...onnnNNNNnnno...','....onnNNNNnno....','.....oonnnnoo.....'];
const BODY_D=['..tooBBBBBBBBoot..','.toosbfbbbbfbsoot.','.tosbbfbbbbfbbsot.','.tosbbbaaaabbbsot.',
 '..oosbaaaaaabsoo..','..oosbaaffaabsoo..','...osbaaaaaabso...','...oosaaaaaasoo...'];
const BODY_U=['..tooBBBBBBBBoot..','.toosbbbbbbbbsoot.','.tosbbbbbbbbbbsot.','.tosbbbbBBbbbbsot.',
 '..oosbbbBBbbbsoo..','..oosbbbbbbbbsoo..','...osbbbbbbbbso...','...oosbbbbbbsoo...'];
const LEG=[
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','.oooGGGGGGGGooo...','...osssossso......','...opppopppo......','...oPPPoPPPo......'],
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','.ooGGGGGGGGGoo....','..osss..ossso.....','..opppo..opppo....','..oPPPo...oPPo....'],
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','.oooGGGGGGGGooo...','...osssossso......','...opppopppo......','...oPPPoPPPo......'],
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','...ooGGGGGGGGoo...','.....osssossso....','....opppo.opppo...','....oPPo...oPPPo..']];
const SIDE_HEAD=['.....oooooo.......','...oohhhhhhoo.....','..ohhhhhhhhhho....','.oHHHHHHHHHHHHo...',
 'ooHHHHHHHHHHHHoo..','.oooooooooooooo...','...onnnnnnnno.....','..onsssssssno.....','..onscssssono.....',
 '..onsooswsono.....','..onssrssnnno.....','..onsssrsnnnno....','...onnSSSnnnnno...','....onnnnnnnnno...'];
const SIDE_BODY=['..tooBBBBBBoot....','.toosbfbbfbsoot...','.tosbbbaaabbsot...','..oosbaaaaabsoo...',
 '..oosbaaffabsoo...','...osbaaaaabso....','...oosaaaaasoo....'];
const SIDE_LEG=[
 ['..oggggggggo......','.oGGGGGGGGGGo.....','.oooGGGGGGooo.....','...osssosso.......','...opppoppo.......','...oPPPoPPo.......'],
 ['..oggggggggo......','.oGGGGGGGGGGo.....','..ooGGGGGGoo......','..osss.osso.......','..opppo.oppo......','.oPPPo...oPPo.....'],
 ['..oggggggggo......','.oGGGGGGGGGGo.....','.oooGGGGGGooo.....','...osssosso.......','...opppoppo.......','...oPPPoPPo.......'],
 ['..oggggggggo......','.oGGGGGGGGGGo.....','...ooGGGGGGoo.....','.....osssosso.....','....opppo.oppo....','...oPPo...oPPo....']];
const SPR={down:LEG.map(l=>mk(HAT_D.concat(FACE_D,BODY_D,l))),
 up:LEG.map(l=>mk(HAT_U.concat(FACE_U,BODY_U,l))),
 right:SIDE_LEG.map(l=>mk(SIDE_HEAD.concat(SIDE_BODY,l)))};
SPR.left=SPR.right.map(mir);
const PW=18;
function player(g){const set=SPR[P.dir],f=P.moving?Math.floor(P.anim*7.5)%4:0,img=set[f];
 const bob=P.moving?Math.round(Math.sin(P.anim*15)*.5):0;
 g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(P.x,P.y+1,8,3,0,0,7);g.fill();
 g.drawImage(img,Math.round(P.x-PW/2),Math.round(P.y-img.height+bob));}

/*========================= 👥 NPC =========================*/
const NPCDEF={
 vendorF:{skin:'#ffd9ae',skinS:'#dfa97e',hair:'#2e1c0f',hair2:'#4a2c18',style:'bun',top:'#e8556f',top2:'#b83a52',apron:'#fff3d8',bottom:'#8a4a5e',hat:null},
 vendorM:{skin:'#e8b98c',skinS:'#c1925f',hair:'#1f1710',hair2:'#3a2a1a',style:'short',top:'#4a90d9',top2:'#2f6db0',apron:null,bottom:'#3a4149',hat:'#dcc089'},
 customer:{skin:'#fbe0c2',skinS:'#dcb894',hair:'#5a3a1e',hair2:'#7a5228',style:'long',top:'#9b6fd4',top2:'#7148ad',apron:null,bottom:'#e8e2d2',hat:null},
 clerk:{skin:'#ffd9ae',skinS:'#dfa97e',hair:'#241a10',hair2:'#3d2a18',style:'pony',top:'#2f9c68',top2:'#1f6f4a',apron:'#f2f7f4',bottom:'#37424d',hat:null},
 kid:{skin:'#ffe3c4',skinS:'#e0bb98',hair:'#3a2210',hair2:'#5a3a1c',style:'short',top:'#ffd86b',top2:'#d9a72f',apron:null,bottom:'#5f8fd4',hat:null}};
function drawNPC(g,x,y,def,t,seed,small){
 const sc=small?.78:1,bob=Math.sin(t*1.9+seed)*.9,sw=Math.sin(t*2.6+seed)*1.1;
 const H=24*sc,W=16*sc,ox=Math.round(x-W/2),oy=Math.round(y-H+bob);
 const px=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(ox+a*sc),Math.round(oy+b*sc),Math.max(1,Math.round(w*sc)),Math.max(1,Math.round(h*sc)));};
 g.fillStyle='rgba(0,0,0,.26)';g.beginPath();g.ellipse(x,y+1,W*.42,W*.16,0,0,7);g.fill();
 px(4,20,3,4,'#3d2a18');px(9,20,3,4,'#3d2a18');
 px(3,19+(sw>0?0:1),4,2,'#241a10');px(9,19+(sw>0?1:0),4,2,'#241a10');
 px(3,15,10,6,def.bottom);px(3,15,10,1,'rgba(255,255,255,.25)');
 px(3,8,10,8,def.top);px(3,8,10,2,def.top2);px(2,9,1,6,def.top2);px(13,9,1,6,def.top2);
 if(def.apron){px(5,11,6,6,def.apron);px(5,11,6,1,'rgba(0,0,0,.12)');}
 px(1,9+(sw>0?0:1),2,6,def.top2);px(13,9+(sw>0?1:0),2,6,def.top2);
 px(1,15+(sw>0?0:1),2,2,def.skin);px(13,15+(sw>0?1:0),2,2,def.skin);
 px(6,7,4,2,def.skinS);px(3,1,10,7,def.skin);px(3,1,10,1,def.skinS);px(3,7,10,1,def.skinS);
 if(def.style==='bun'){px(3,0,10,3,def.hair);px(4,-2,8,3,def.hair2);px(6,-4,4,3,def.hair);px(2,2,2,4,def.hair);px(12,2,2,4,def.hair);}
 else if(def.style==='long'){px(3,0,10,3,def.hair);px(2,1,2,9,def.hair);px(12,1,2,9,def.hair);px(2,9,2,2,def.hair2);px(12,9,2,2,def.hair2);}
 else if(def.style==='pony'){px(3,0,10,3,def.hair);px(2,2,2,3,def.hair);px(12,2,2,3,def.hair);px(13,4,2,7,def.hair2);}
 else{px(3,0,10,3,def.hair);px(2,1,2,3,def.hair);px(12,1,2,3,def.hair);}
 if(def.hat){px(2,-1,12,2,def.hat);px(0,1,16,2,def.hat);px(0,1,16,1,'rgba(255,255,255,.3)');}
 px(5,4,2,2,'#241a10');px(9,4,2,2,'#241a10');px(5,4,1,1,'#fff');px(9,4,1,1,'#fff');
 px(4,6,1,1,'rgba(230,110,130,.55)');px(11,6,1,1,'rgba(230,110,130,.55)');px(7,6,2,1,'#c25a6a');}

/*========================= STATE =========================*/
const PLOTS=[[248,116],[306,116],[364,116],[422,116],[248,240],[306,240],[364,240],[422,240]];
const RACKS=[[170,152],[240,152],[310,152],[170,206],[240,206],[310,206]];
const ST=[0,7,9,11,13,16],TH=[0,14,26,40,54,68,68],RIPEN=16;
const PRICE={ripe:12,green:5,dried:9,roll:60};
const SCNAME={farm:'สวนกล้วย & บ้าน',backyard:'หลังบ้าน (ลานตาก)',kitchen:'ครัวแปรรูป',market:'ตลาดสด',coop:'ร้านค้าสหกรณ์'};
function fresh(){return{money:60,inv:{green:0,ripe:0,slice:0,dried:0,flour:0,roll:0},

function bLeaf(g,x,y,len,wid,ang,light,dark,rib){
 g.save();g.translate(x,y);g.rotate(ang);
 const N=13,droop=wid*1.5;
 const pt=u=>({x:len*u,y:droop*u*u});
 const hw=u=>wid*Math.sin(Math.PI*Math.pow(cl(u,0,1),.72))*(1-u*.12);
 /* เงาใบ (silhouette ขอบเข้ม) */
 for(let i=0;i<N;i++){const u0=i/N,u1=(i+1)/N,a=pt(u0),b=pt(u1);
  const dx=b.x-a.x,dy=b.y-a.y,dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl;
  const w0=hw(u0)*1.14,w1=hw(u1)*1.14;
  g.fillStyle='#14521c';
  g.beginPath();g.moveTo(a.x+nx*w0,a.y+ny*w0);g.lineTo(b.x+nx*w1,b.y+ny*w1);
  g.lineTo(b.x-nx*w1,b.y-ny*w1);g.lineTo(a.x-nx*w0,a.y-ny*w0);g.closePath();g.fill();}
 /* ริ้วใบ (ซี่) */
 for(let i=0;i<N;i++){const u0=i/N,u1=(i+1)/N,a=pt(u0),b=pt(u1);
  const dx=b.x-a.x,dy=b.y-a.y,dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl;
  const cut=(i%2)?.80:.97;

 gd.addColorStop(.78,'#84a03c');gd.addColorStop(1,'#4f6b26');

 g.lineTo(cx+tw*.5+sway,by-h);g.quadraticCurveTo(cx+tw*.75+sway,by-h*.55,cx+tw*1.15,by);g.closePath();g.fill();
 /* กาบไม้น้ำตาลไขว้ที่โคน */
 if(gr>.5){const nb=Math.floor(2+gr*3);
  for(let i=0;i<nb;i++){const yy=by-6-i*(h*.13),ww=tw*(1.05-i*.07);
   g.fillStyle=i%2?'#a4682f':'#8a5526';

 /* แถบสถานะ */
 if(pl.stage>=1&&pl.stage<=4){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(cx-12,by+3,24,5);

function blocked(nx,ny){const s=SC[scene],b=s.bounds;
 if(nx<b[0]||nx>b[2]||ny<b[1]||ny>b[3])return true;
 const fx=nx-6,fy=ny-5,fw=12,fh=6;
 for(const o of s.solids)if(ov(fx,fy,fw,fh,o))return true;
 return false;}
const spd=()=>54*(1+(S.up.boots?.25:0)+(S.up.vehicle?.35:0));
/* กันตำแหน่งเซฟเก่าหลุดขอบฉาก */

/*========================= UPDATE =========================*/
function update(dt){
 S.clock=(S.clock+dt/220)%1;
 if(mg){mgUpd(dt);edge=false;return;}
 if(trans){trans.t+=dt*1.7;
  if(trans.t>=.5&&trans.to){scene=trans.to;P.x=trans.x;P.y=trans.y;P.dir='down';trans.to=null;
   exitLock=true;relabel();hud();save();}
  if(trans.t>=1)trans=null;edge=false;return;}
 S.plots.forEach((pl,i)=>{const auto=S.up.sprink>=2||(S.up.sprink===1&&i<4);
  if(auto)pl.water=1;else if(pl.water>0)pl.water=Math.max(0,pl.water-dt/26);
  if(pl.stage>=1&&pl.stage<=4){const m=(pl.water>.15?1.7:1)*(1+.25*S.up.fert);
   pl.prog+=dt/ST[pl.stage]*m;if(pl.prog>=1){pl.prog=0;pl.stage++;if(pl.stage===5)pl.rp=0;}}
  else if(pl.stage===5){pl.rp+=dt*(1+.12*S.up.fert);
   if(pl.rp>=RIPEN){pl.stage=6;pl.rp=RIPEN;if(scene==='farm')sfx.ripe();}}});
 const nR=3+(S.up.racks?3:0);
 S.racks.forEach((r,i)=>{if(i<nR&&r.item===1&&r.prog<1)r.prog=Math.min(1,r.prog+dt/18);});
 drops.forEach(d=>{d.l-=dt;d.y+=dt*44;});drops=drops.filter(d=>d.l>0);
 dust.forEach(d=>d.l-=dt);dust=dust.filter(d=>d.l>0);
 if(busy){busy.t+=dt;if(busy.t>=busy.d){busy.f();busy=null;qTick();}edge=false;return;}
 if(pk){edge=false;return;}
 let vx=0,vy=0;
 if(keys['KeyW']||keys['ArrowUp']||td.u)vy--;if(keys['KeyS']||keys['ArrowDown']||td.d)vy++;
 if(keys['KeyA']||keys['ArrowLeft']||td.l)vx--;if(keys['KeyD']||keys['ArrowRight']||td.r)vx++;
 P.moving=!!(vx||vy);
 if(P.moving){const m=Math.hypot(vx,vy)||1;vx/=m;vy/=m;
  P.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up');
  const s=spd()*dt,nx=P.x+vx*s,ny=P.y+vy*s;
  if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny;P.anim+=dt;
  if(S.up.vehicle&&Math.random()<.25)dust.push({x:P.x,y:P.y,l:.4});}
 else P.anim=0;
 /* ★ ระบบประตูแบบใหม่: ปลดล็อกเมื่อเดินพ้นโซนประตูเท่านั้น = ไม่เด้งวน ★ */
 const inEx=SC[scene].exits.find(e=>ov(P.x-7,P.y-7,14,9,e.r));
 if(exitLock){if(!inEx)exitLock=false;}
 else if(inEx){go(inEx.to,inEx.sx,inEx.sy);toast('🚪 ไป '+SCNAME[inEx.to]);}
 const a=near();
 if(a){promptEl.classList.add('on');promptEl.innerHTML='<kbd>E</kbd> '+a.txt;if(edge&&a.act)a.act();}
 else promptEl.classList.remove('on');
 edge=false;hud();qTick();}

  L.push({y:244,f:()=>drawNPC(ctx,392,244,NPCDEF.kid,t,4,1)});}
 else if(scene==='coop'){
  L.push({y:90,f:()=>drawNPC(ctx,152,90,NPCDEF.clerk,t,5)});
  L.push({y:214,f:()=>drawNPC(ctx,320,214,NPCDEF.customer,t,6)});}
 else if(scene==='kitchen'){
  ctx.fillStyle='rgba(255,140,60,'+(.26+Math.sin(t*9)*.1)+')';ctx.beginPath();ctx.ellipse(182,122,15+Math.sin(t*7)*2,5,0,0,7);ctx.fill();
  L.push({y:130,f:()=>{for(let i=0;i<Math.min(4,S.inv.roll);i++){ctx.fillStyle='#e0b95f';ctx.fillRect(256+i*11,104,9,13);
   ctx.fillStyle='#caa044';ctx.fillRect(256+i*11,104,9,4);}}});}
 dust.forEach(d=>{ctx.fillStyle='rgba(212,192,152,'+d.l+')';ctx.fillRect(d.x-2,d.y-1,3,2);});
 drops.forEach(d=>{ctx.fillStyle='rgba(127,208,255,'+cl(d.l*2,0,.9)+')';ctx.fillRect(d.x,d.y,1,3);});
 L.push({y:P.y,f:player});
 L.sort((a,b)=>a.y-b.y).forEach(o=>o.f(ctx));
 SC[scene].exits.forEach(e=>exitArrow(ctx,e,t));
 const tn=SC[scene].out?tint():'rgba(255,198,116,.08)';
 if(tn){ctx.fillStyle=tn;ctx.fillRect(0,0,VW,VH);}
 if(SC[scene].dim){const v2=ctx.createRadialGradient(P.x,P.y-12,20,P.x,P.y-12,180);
  v2.addColorStop(0,'rgba(255,220,150,.10)');v2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=v2;ctx.fillRect(0,0,VW,VH);}
 const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.34,VW/2,VH/2,VH*.96);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.36)');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
 if(busy){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(VW/2-50,VH-44,100,10);
  ctx.fillStyle='#ffd86b';ctx.fillRect(VW/2-48,VH-42,96*(busy.t/busy.d),6);
  promptEl.classList.add('on');promptEl.textContent=busy.l;}
 if(mg)mgDraw(ctx);
 if(trans){const a=1-Math.abs(trans.t*2-1);ctx.fillStyle='rgba(3,5,8,'+cl(a,0,1)+')';ctx.fillRect(0,0,VW,VH);}}

/*========================= LOOP =========================*/
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt);render(T);requestAnimationFrame(loop);}
relabel();hud();qTick();requestAnimationFrame(loop);
setTimeout(()=>toast('🏪 ตลาดเข้า–ออกได้แล้ว! เดินถนนไปขวาสุดเลย'),700);
setTimeout(()=>toast('🏠 ปุ่มขวาล่าง = กลับบ้านทันที (หรือกด B)'),2700);
</script>
