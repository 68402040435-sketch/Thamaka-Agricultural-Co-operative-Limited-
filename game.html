<html lang="th">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#05070a;color:#fff;
 font-family:'Kanit',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
 background:radial-gradient(circle at 50% 28%,#17212e,#05070a 72%)}
#stage{position:relative;--s:3;box-shadow:0 0 0 calc(var(--s)*1px) #22354a,0 calc(var(--s)*6px) calc(var(--s)*18px) rgba(0,0,0,.75)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#labels,#hud,#prompt,#toastbox,#panel,#mgui,#menu,#quest{position:absolute;pointer-events:none}
#labels{inset:0}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:calc(var(--s)*5.1px);font-weight:600;
 background:rgba(10,14,22,.84);border:calc(var(--s)*.8px) solid #ffd86b;color:#ffe9a8;
 padding:calc(var(--s)*1.1px) calc(var(--s)*2.8px);border-radius:calc(var(--s)*2px);text-shadow:0 calc(var(--s)*.6px) 0 #000}
.lbl.soft{border-color:#7fd0ff;color:#dff2ff}
.lbl.door{border-color:#9ef0a8;color:#dbffe1}
.lbl.field{border-color:#b6ff8a;color:#e6ffd6}
#hud{left:calc(var(--s)*4px);top:calc(var(--s)*4px);display:flex;flex-wrap:wrap;gap:calc(var(--s)*2.2px);
 font-size:calc(var(--s)*5.4px);font-weight:600;max-width:calc(var(--s)*320px)}
.chip{background:rgba(9,13,20,.86);border:calc(var(--s)*.8px) solid #35527d;border-radius:calc(var(--s)*2.4px);
 padding:calc(var(--s)*1.2px) calc(var(--s)*2.8px);display:flex;align-items:center;gap:calc(var(--s)*1.4px);text-shadow:0 1px 0 #000}
.chip b{color:#ffd86b;font-weight:800}
.chip.place{border-color:#7fd0ff;color:#dff2ff}
.chip.ride{border-color:#ffb36b;color:#ffe2c4}
#quest{left:calc(var(--s)*4px);top:calc(var(--s)*25px);font-size:calc(var(--s)*5px);font-weight:600;
 background:rgba(9,13,20,.86);border-left:calc(var(--s)*2px) solid #ffd86b;border-radius:calc(var(--s)*2px);
 padding:calc(var(--s)*1.4px) calc(var(--s)*3px);color:#ffe9a8;max-width:calc(var(--s)*220px)}
#prompt{left:50%;bottom:calc(var(--s)*7px);transform:translateX(-50%);font-size:calc(var(--s)*6px);font-weight:600;
 background:rgba(7,11,17,.93);border:calc(var(--s)*1px) solid #ffd86b;border-radius:calc(var(--s)*3px);
 padding:calc(var(--s)*1.8px) calc(var(--s)*4.5px);white-space:nowrap;opacity:0;transition:opacity .12s}
#prompt.on{opacity:1}
#prompt kbd{background:#ffd86b;color:#2b1d06;border-radius:calc(var(--s)*1.4px);padding:0 calc(var(--s)*2px);font-weight:800;font-family:inherit}
#toastbox{right:calc(var(--s)*4px);top:calc(var(--s)*4px);display:flex;flex-direction:column;gap:calc(var(--s)*2px);align-items:flex-end}
.toast{font-size:calc(var(--s)*5px);font-weight:600;background:rgba(7,11,17,.93);border-left:calc(var(--s)*2px) solid #6ee27a;
 padding:calc(var(--s)*1.6px) calc(var(--s)*3.4px);border-radius:calc(var(--s)*2px);animation:tin .28s ease;max-width:calc(var(--s)*210px)}
.toast.bad{border-left-color:#ff6b6b}
@keyframes tin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
#panel{inset:0;display:none;place-items:center;background:rgba(3,5,9,.76);pointer-events:auto}
#panel.on{display:grid}
.pbox{width:92%;max-width:calc(var(--s)*350px);max-height:92%;overflow:auto;background:#111a26;
 border:calc(var(--s)*1.4px) solid #ffd86b;border-radius:calc(var(--s)*4px);box-shadow:0 calc(var(--s)*4px) 0 #090e15}
.ptitle{font-size:calc(var(--s)*7px);font-weight:800;color:#2b1d06;background:linear-gradient(#ffd86b,#e9b53a);
 padding:calc(var(--s)*2.2px) calc(var(--s)*4.5px);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.pbody{padding:calc(var(--s)*3.5px);display:flex;flex-direction:column;gap:calc(var(--s)*2.2px)}
.row{display:flex;align-items:center;gap:calc(var(--s)*2.6px);background:#1a2534;border:calc(var(--s)*.8px) solid #2f4460;
 border-radius:calc(var(--s)*2.4px);padding:calc(var(--s)*2.2px) calc(var(--s)*3px)}
.row .info{flex:1;min-width:0}
.nm{font-size:calc(var(--s)*5.7px);font-weight:700}
.ds{font-size:calc(var(--s)*4.6px);opacity:.82;font-weight:400}
.btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:800;font-size:calc(var(--s)*5.3px);color:#2b1d06;
 background:linear-gradient(#ffe291,#e9b53a);border:none;border-bottom:calc(var(--s)*2px) solid #a97d18;
 border-radius:calc(var(--s)*2px);padding:calc(var(--s)*2.2px) calc(var(--s)*4px);white-space:nowrap;min-height:34px}
.btn:active{transform:translateY(calc(var(--s)*1px));border-bottom-width:calc(var(--s)*1px)}
.btn.blue{background:linear-gradient(#a6e3ff,#3fa8dd);border-bottom-color:#1d6f96;color:#062031}
.btn.red{background:linear-gradient(#ff9c9c,#e05353);border-bottom-color:#8f2b2b;color:#2b0606}
.btn.dis{background:#3f4c5a;color:#93a1b2;border-bottom-color:#28313b;cursor:not-allowed}
.x{cursor:pointer;pointer-events:auto;font-weight:800;font-size:calc(var(--s)*8px);line-height:1;padding:0 6px}
#mgui{position:absolute;left:50%;top:calc(var(--s)*13px);transform:translateX(-50%);text-align:center;display:none;width:100%;pointer-events:none}
#mgui.on{display:block}
#mgt{font-size:calc(var(--s)*7.5px);font-weight:800;color:#ffd86b;text-shadow:0 calc(var(--s)*1px) 0 #000}
#mgd{font-size:calc(var(--s)*5px);font-weight:600;text-shadow:0 1px 2px #000;opacity:.95}
#menu{right:calc(var(--s)*4px);bottom:calc(var(--s)*4px);pointer-events:auto;display:flex;gap:calc(var(--s)*2px)}
.mb{cursor:pointer;font-size:calc(var(--s)*5.2px);background:rgba(9,13,20,.88);border:calc(var(--s)*.8px) solid #35527d;
 border-radius:calc(var(--s)*2px);padding:calc(var(--s)*1.4px) calc(var(--s)*2.6px);color:#cfe3ff;font-weight:600}
.mb.home{border-color:#9ef0a8;color:#dbffe1}
/* ===== TOUCH (นอกจอเกม) ===== */
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:40}
body.tm #touch{display:block}
#dpad{position:absolute;pointer-events:none}
.pad{position:absolute;pointer-events:auto;background:rgba(240,248,255,.13);border:2px solid rgba(255,255,255,.34);
 border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;backdrop-filter:blur(2px)}
.pad.on{background:rgba(255,216,107,.55);border-color:#ffd86b;color:#2b1d06}
.abtn{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;font-weight:800;
 background:rgba(255,216,107,.9);color:#2b1d06;border:3px solid rgba(255,255,255,.55);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.abtn.sec{background:rgba(127,208,255,.9);border-color:rgba(255,255,255,.5)}
.abtn:active{transform:scale(.93)}
body.tm #menu{bottom:auto;top:50%;right:calc(var(--s)*3px);transform:translateY(-50%);flex-direction:column}
body.tm .mb{font-size:calc(var(--s)*5.6px);padding:calc(var(--s)*2.4px) calc(var(--s)*3px)}
body.tm #toastbox{top:calc(var(--s)*4px);right:calc(var(--s)*22px)}
#rot{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:none;
 background:rgba(9,13,20,.92);border:1px solid #ffd86b;color:#ffe9a8;font-size:13px;font-weight:600;
 padding:7px 14px;border-radius:20px;pointer-events:auto}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="480" height="270"></canvas>
  <div id="labels"></div><div id="hud"></div><div id="quest"></div>
  <div id="prompt"></div><div id="toastbox"></div>
  <div id="mgui"><div id="mgt"></div><div id="mgd"></div></div>
  <div id="menu">
    <div class="mb" id="mHelp">? ช่วยเหลือ</div>
    <div class="mb" id="mMap">🗺 แผนที่</div>
    <div class="mb home" id="mHome">🏠 กลับบ้าน</div>
    <div class="mb" id="mFs">⛶ เต็มจอ</div>
  </div>
  <div id="panel"><div class="pbox"><div class="ptitle"><span id="pt"></span><span class="x" id="px">✕</span></div><div class="pbody" id="pb"></div></div></div>
</div></div>
<div id="touch">
  <div id="dpad">
    <div class="pad" data-d="up">▲</div><div class="pad" data-d="left">◀</div>
    <div class="pad" data-d="right">▶</div><div class="pad" data-d="down">▼</div>
  </div>
  <div class="abtn sec" id="bF">🚲</div>
  <div class="abtn" id="bA">A</div>
</div>
<div id="rot">📱 หมุนจอแนวนอนจะเล่นสนุกกว่า — แตะเพื่อปิด</div>
<script>
"use strict";
const VW=480,VH=270;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const wrap=document.getElementById('wrap'),stage=document.getElementById('stage'),labelsEl=document.getElementById('labels');
const hudEl=document.getElementById('hud'),questEl=document.getElementById('quest');
const promptEl=document.getElementById('prompt'),toastBox=document.getElementById('toastbox');
const panelEl=document.getElementById('panel'),ptEl=document.getElementById('pt'),pbEl=document.getElementById('pb');
const mguiEl=document.getElementById('mgui'),mgtEl=document.getElementById('mgt'),mgdEl=document.getElementById('mgd');
const cl=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,y){let n=(x*7919+y*104729)|0;n=(n<<13)^n;return((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff;}
function ov(ax,ay,aw,ah,r){return ax<r[0]+r[2]&&ax+aw>r[0]&&ay<r[1]+r[3]&&ay+ah>r[1];}
function mixc(a,b,t){t=cl(t,0,1);return'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}

/*=============== 📱 LAYOUT / MOBILE ===============*/
const isTouch=(matchMedia('(pointer:coarse)').matches)||('ontouchstart'in window);
if(isTouch)document.body.classList.add('tm');
function layout(){
 const vw=innerWidth,vh=(window.visualViewport?Math.round(visualViewport.height):innerHeight);
 const portrait=vh>vw*1.05;
 let availH=vh,availW=vw;
 if(isTouch){ if(portrait){availH=vh*0.60;} else {availW=vw*0.99;availH=vh*0.99;} }
 const s=Math.min(availW/VW,availH/VH);
 stage.style.width=(VW*s)+'px';stage.style.height=(VH*s)+'px';stage.style.setProperty('--s',s);
 wrap.style.alignItems=(isTouch&&portrait)?'flex-start':'center';
 wrap.style.paddingTop=(isTouch&&portrait)?(vh*0.02)+'px':'0';
 if(isTouch){
  const b=Math.round(cl(Math.min(vw,vh)*0.145,48,92));
  const dp=document.getElementById('dpad');
  const dx=Math.round(b*0.35), dy=vh-Math.round(b*3.3);
  dp.style.left=dx+'px';dp.style.top=dy+'px';dp.style.width=(b*3)+'px';dp.style.height=(b*3)+'px';
  const set=(d,x,y)=>{const e=dp.querySelector('[data-d="'+d+'"]');
   e.style.width=b+'px';e.style.height=b+'px';e.style.left=(x*b)+'px';e.style.top=(y*b)+'px';e.style.fontSize=(b*0.42)+'px';};
  set('up',1,0);set('left',0,1);set('right',2,1);set('down',1,2);
  const A=document.getElementById('bA'),F=document.getElementById('bF');
  const ab=Math.round(b*1.18);
  A.style.width=ab+'px';A.style.height=ab+'px';A.style.fontSize=(ab*0.38)+'px';
  A.style.left=(vw-ab-Math.round(b*0.4))+'px';A.style.top=(vh-ab-Math.round(b*0.9))+'px';
  const fb=Math.round(b*0.9);
  F.style.width=fb+'px';F.style.height=fb+'px';F.style.fontSize=(fb*0.42)+'px';
  F.style.left=(vw-ab-fb-Math.round(b*0.75))+'px';F.style.top=(vh-fb-Math.round(b*1.25))+'px';
 }
 const r=document.getElementById('rot');
 r.style.display=(isTouch&&portrait&&!sessionStorage.getItem('rh'))?'block':'none';
}
addEventListener('resize',()=>setTimeout(layout,50));
addEventListener('orientationchange',()=>setTimeout(layout,250));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(layout,50));
document.getElementById('rot').onclick=function(){sessionStorage.setItem('rh','1');this.style.display='none';};
document.getElementById('mFs').onclick=()=>{const d=document.documentElement;
 if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);}
 else document.exitFullscreen();setTimeout(layout,400);};
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('contextmenu',e=>e.preventDefault());
layout();

/*=============== AUDIO ===============*/
let AC=null;
function snd(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,AC.currentTime);
 g.gain.setValueAtTime(v||.045,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={ok:()=>snd(640,.09),door:()=>{snd(320,.07,'square',.04);setTimeout(()=>snd(480,.1),70);},
 pick:()=>{snd(880,.07);setTimeout(()=>snd(1200,.09),70);},coin:()=>{snd(1046,.06);setTimeout(()=>snd(1568,.13),60);},
 bad:()=>snd(150,.19,'sawtooth',.05),plant:()=>snd(400,.11,'triangle',.06),water:()=>snd(760,.08,'sine',.05),
 ripe:()=>{snd(784,.09,'triangle',.05);setTimeout(()=>snd(1175,.14,'triangle',.05),90);},
 bell:()=>{snd(1568,.05,'sine',.05);setTimeout(()=>snd(2093,.09,'sine',.04),60);},
 engine:()=>{snd(110,.18,'sawtooth',.05);setTimeout(()=>snd(150,.22,'sawtooth',.04),120);}};

/*=============== 👩‍🌾 PLAYER SPRITE ===============*/
const PAL={'.':null,o:'#1b1208',k:'#2a1c0d',
 s:'#ffdcb2',S:'#e8b184',c:'#ffeed4',r:'#e05a7a',
 h:'#f6d98a',H:'#d4a94e',y:'#fff0bd',
 n:'#4a2c17',N:'#6b4223',m:'#8a5a2f',
 b:'#6fc3f0',B:'#3f96c9',w:'#fdfdfd',f:'#fff3b0',
 a:'#fff6e2',A:'#e2d3b4',g:'#6fd9a8',G:'#3fa87c',
 t:'#ffd86b',T:'#d9a72f',p:'#7a4f2a',P:'#55341a'};
function mk(rows){const w=Math.max.apply(null,rows.map(r=>r.length)),h=rows.length;
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const q=PAL[rows[j][i]||'.'];if(q){x.fillStyle=q;x.fillRect(i,j,1,1);}}return c;}
function mir(c0){const c=document.createElement('canvas');c.width=c0.width;c.height=c0.height;
 const x=c.getContext('2d');x.translate(c0.width,0);x.scale(-1,1);x.drawImage(c0,0,0);return c;}
const HAT_D=['......oooooo......','....oohhhhhhoo....','...ohyyhhhhyyho...','..ohhhhhhhhhhhho..',
 '.oHHHHHHHHHHHHHHo.','ooHHHHHHHHHHHHHHoo','.oooooooooooooooo.'];
const HAT_U=['......oooooo......','....oohhhhhhoo....','...ohhhhhhhhhho...','..ohhhhhhhhhhhho..',
 '.oHHHHHHHHHHHHHHo.','ooHHHHHHHHHHHHHHoo','.oooooooooooooooo.'];
const FACE_D=['...onnnnnnnnnno...','..onsssssssssno...','..onscsssssscno...','..onsoosssoosno...',
 '..onsooswwoosno...','..onssrsssrssno...','..onsssrrrsssno...','..onnsSSSSSsnno...','...onnNNNNnno.....'];
const FACE_U=['...onnnnnnnnnno...','..onnnnnnnnnnnno..','..onnNNNNNNNNnno..','..onnNNmmmmNNnno..',
 '..onnNNmmmmNNnno..','..onnNNNNNNNNnno..','...onnnNNNNnnno...','....onnNNNNnno....','.....oonnnnoo.....'];
const BODY_D=['..tooBBBBBBBBoot..','.toosbfbbbbfbsoot.','.tosbbfbbbbfbbsot.','.tosbbbaaaabbbsot.',
 '..oosbaaaaaabsoo..','..oosbaaffaabsoo..','...osbaaaaaabso...','...oosaaaaaasoo...'];
const BODY_U=['..tooBBBBBBBBoot..','.toosbbbbbbbbsoot.','.tosbbbbbbbbbbsot.','.tosbbbbBBbbbbsot.',
 '..oosbbbBBbbbsoo..','..oosbbbbbbbbsoo..','...osbbbbbbbbso...','...oosbbbbbbsoo...'];
const LEG=[
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','.oooGGGGGGGGooo...','...osssossso......','...opppopppo......','...oPPPoPPPo......'],
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','.ooGGGGGGGGGoo....','..osss..ossso.....','..opppo..opppo....','..oPPPo...oPPo....'],
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','.oooGGGGGGGGooo...','...osssossso......','...opppopppo......','...oPPPoPPPo......'],
 ['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','...ooGGGGGGGGoo...','.....osssossso....','....opppo.opppo...','....oPPo...oPPPo..']];
const SIDE_HEAD=['.....oooooooo.....','...oohhhhhhhhoo...','..ohhhhhhhhhhhho..','.oHHHHHHHHHHHHHo..',
 '..ooooooooooooo...','...onnnnnsssssso..','..onnnnnnscsssso..','..onnnnnnsooksso..',
 '..onnnnnnsoowsso..','..onnnnnnssrssso..','..onnnnnnsssrsso..','...onnnnnSSSSSo...',
 '...onnnnnnnSSo....','....onnnnnnno.....'];
const SIDE_BODY=['..tooBBBBBBBoot...','.toosbfbbbbfbsot..','.tosbbbaaaabbsot..','..oosbaaaaaabsoo..',
 '..oosbaaffaabsoo..','...osbaaaaaabso...','...oosaaaaaasoo...'];
const SIDE_LEG=[
 ['..oggggggggggo....','.oGGGGGGGGGGGo....','.oooGGGGGGGooo....','...osssoosso......','...opppoppo.......','...oPPPoPPo.......'],
 ['..oggggggggggo....','.oGGGGGGGGGGGo....','..ooGGGGGGGoo.....','..osss..osso......','..opppo..oppo.....','.oPPPo....oPPo....'],
 ['..oggggggggggo....','.oGGGGGGGGGGGo....','.oooGGGGGGGooo....','...osssoosso......','...opppoppo.......','...oPPPoPPo.......'],
 ['..oggggggggggo....','.oGGGGGGGGGGGo....','...ooGGGGGGGoo....','.....osssoosso....','....opppo..oppo...','...oPPo....oPPo...']];
const SPR={down:LEG.map(l=>mk(HAT_D.concat(FACE_D,BODY_D,l))),
 up:LEG.map(l=>mk(HAT_U.concat(FACE_U,BODY_U,l))),
 right:SIDE_LEG.map(l=>mk(SIDE_HEAD.concat(SIDE_BODY,l)))};
SPR.left=SPR.right.map(mir);
const SIT={down:mk(HAT_D.concat(FACE_D,BODY_D,['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','..ooGGGGGGGGGoo...'])),
 up:mk(HAT_U.concat(FACE_U,BODY_U,['..ogggggggggggo...','.oGGGGGGGGGGGGGo..','..ooGGGGGGGGGoo...'])),
 right:mk(SIDE_HEAD.concat(SIDE_BODY,['..oggggggggggo....','.oGGGGGGGGGGGo....','..ooGGGGGGGoo.....']))};
SIT.left=mir(SIT.right);
const PW=18;

/*=============== NPC ===============*/
const NPCDEF={
 vendorF:{skin:'#ffd9ae',hair:'#2e1c0f',hair2:'#4a2c18',style:'bun',top:'#e8556f',top2:'#b83a52',apron:'#fff3d8',bottom:'#8a4a5e',hat:null,skinS:'#dfa97e'},
 vendorM:{skin:'#e8b98c',hair:'#1f1710',hair2:'#3a2a1a',style:'short',top:'#4a90d9',top2:'#2f6db0',apron:null,bottom:'#3a4149',hat:'#dcc089',skinS:'#c1925f'},

const LF_OUT='#125c1c',LF_D='#2b8f2e',LF_M='#46ad36',LF_L='#67c94a',LF_H='#8ee05c',RIBC='#dff07a';
function bananaLeaf(g,x,y,len,wid,ang,tone){
 g.save();g.translate(x,y);g.rotate(ang);
 const N=18,droop=wid*2.05;
 const PT=u=>({x:len*u,y:droop*u*u});
 const HW=u=>wid*Math.sin(Math.PI*Math.pow(cl(u,0,1),.56))*(1.06-u*.13);
 /* ก้านใบ */
 g.strokeStyle='#3f6b1d';g.lineWidth=4;g.lineCap='round';
 g.beginPath();g.moveTo(-5,-1);g.lineTo(len*.14,droop*.02);g.stroke();
 g.strokeStyle='#8fb241';g.lineWidth=2;
 g.beginPath();g.moveTo(-5,-1);g.lineTo(len*.14,droop*.02);g.stroke();
 /* เงารวมของใบ (ขอบเข้ม) */
 g.fillStyle=LF_OUT;g.beginPath();g.moveTo(0,0);
 for(let i=0;i<=N;i++){const u=i/N,p=PT(u),p2=PT(Math.min(1,u+.01));
  const dx=p2.x-p.x,dy=p2.y-p.y,dl=Math.hypot(dx,dy)||1,w=HW(u)*1.22;
  g.lineTo(p.x-dy/dl*w,p.y+dx/dl*w);}
 for(let i=N;i>=0;i--){const u=i/N,p=PT(u),p2=PT(Math.min(1,u+.01));
  const dx=p2.x-p.x,dy=p2.y-p.y,dl=Math.hypot(dx,dy)||1,w=HW(u)*1.22;
  g.lineTo(p.x+dy/dl*w,p.y-dx/dl*w);}
 g.closePath();g.fill();
 /* ริ้วใบสลับลึก-ตื้น */
 const CUT=[1,.74,.95,.66,1,.82,.9,.7];
 for(let i=0;i<N;i++){
  const u0=i/N,u1=(i+1)/N,a=PT(u0),b=PT(u1);
  const dx=b.x-a.x,dy=b.y-a.y,dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl;
  const cut=CUT[i%CUT.length];
  const w0=HW(u0)*cut,w1=HW(u1)*cut;
  g.fillStyle=tone?LF_L:LF_M;
  g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x+nx*w0,a.y+ny*w0);
  g.lineTo(b.x+nx*w1,b.y+ny*w1);g.lineTo(b.x,b.y);g.closePath();g.fill();
  g.fillStyle=tone?LF_M:LF_D;
  g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-nx*w0,a.y-ny*w0);
  g.lineTo(b.x-nx*w1,b.y-ny*w1);g.lineTo(b.x,b.y);g.closePath();g.fill();
  /* ไฮไลต์ริ้วบน */
  if(i%2===0){g.fillStyle=tone?'rgba(190,245,140,.35)':'rgba(160,230,120,.26)';
   g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x+nx*w0*.55,a.y+ny*w0*.55);
   g.lineTo(b.x+nx*w1*.55,b.y+ny*w1*.55);g.lineTo(b.x,b.y);g.closePath();g.fill();}
  /* ร่องแบ่งริ้ว */
  g.strokeStyle='rgba(12,70,20,.55)';g.lineWidth=.9;
  g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x+nx*w0,a.y+ny*w0);g.stroke();
  g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-nx*w0,a.y-ny*w0);g.stroke();}
 /* ก้านกลาง */
 g.strokeStyle=LF_OUT;g.lineWidth=3;g.beginPath();g.moveTo(0,0);
 for(let i=1;i<=N;i++){const p=PT(i/N);g.lineTo(p.x,p.y);}g.stroke();
 g.strokeStyle=RIBC;g.lineWidth=1.6;g.beginPath();g.moveTo(0,0);
 for(let i=1;i<=N;i++){const p=PT(i/N);g.lineTo(p.x,p.y);}g.stroke();
 g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=.7;g.beginPath();g.moveTo(0,-.8);
 for(let i=1;i<=N;i++){const p=PT(i/N);g.lineTo(p.x,p.y-.8);}g.stroke();
 g.restore();}

 g.quadraticCurveTo(8,hy+13,6.5,hy-1);g.closePath();g.fill();
 g.fillStyle='#8a2f9e';
 g.beginPath();g.moveTo(-5,hy-1);g.quadraticCurveTo(-6.4,hy+12,0,hy+21);
 g.quadraticCurveTo(6.4,hy+12,5,hy-1);g.closePath();g.fill();
 g.fillStyle='#b154c6';g.beginPath();g.ellipse(-1.6,hy+6,2,5.5,0,0,7);g.fill();

function drawTreeRaw(g,cx,by,h,stage,rp){
 const gr=cl(h/TH[5],0,1),tw=Math.max(3.2,h*.104);
 g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(cx,by,h*.3+8,h*.09+3,0,0,7);g.fill();
 /* ราก */
 if(gr>.28){for(let i=-4;i<=4;i++){if(!i)continue;
   const rx=cx+i*(tw*.58);
   g.fillStyle=i%2?'#8a5526':'#6d3f1e';
   g.beginPath();g.moveTo(rx,by-9);g.lineTo(rx+i*3,by+3);g.lineTo(rx+i*3+3.2,by+3);g.closePath();g.fill();}
  g.fillStyle='#a8703a';g.beginPath();g.ellipse(cx,by-5,tw*1.7,5,0,0,7);g.fill();
  g.fillStyle='#c68a41';g.beginPath();g.ellipse(cx-2,by-7,tw*.95,2.4,0,0,7);g.fill();}
 /* ลำต้น */
 const gd=g.createLinearGradient(cx-tw*1.25,0,cx+tw*1.25,0);
 gd.addColorStop(0,'#415c1e');gd.addColorStop(.14,'#6f8c2f');gd.addColorStop(.36,'#a7c052');
 gd.addColorStop(.55,'#cbdc72');gd.addColorStop(.74,'#9ab845');gd.addColorStop(1,'#3d581c');
 g.fillStyle=gd;
 g.beginPath();g.moveTo(cx-tw*1.25,by-2);
 g.quadraticCurveTo(cx-tw*.82,by-h*.55,cx-tw*.5,by-h);
 g.lineTo(cx+tw*.5,by-h);
 g.quadraticCurveTo(cx+tw*.82,by-h*.55,cx+tw*1.25,by-2);g.closePath();g.fill();
 g.strokeStyle='rgba(20,60,15,.5)';g.lineWidth=1.2;g.stroke();
 /* กาบไม้ไขว้ */
 if(gr>.4){const nb=Math.floor(2+gr*4);
  for(let i=0;i<nb;i++){
   const yy=by-9-i*(h*.112),ww=tw*(1.14-i*.055);
   g.fillStyle='#8a5526';
   g.beginPath();g.moveTo(cx-ww,yy+3);g.lineTo(cx,yy-7);g.lineTo(cx+ww,yy+3);
   g.lineTo(cx+ww*.68,yy+6);g.lineTo(cx,yy-1.5);g.lineTo(cx-ww*.68,yy+6);g.closePath();g.fill();
   g.fillStyle='#cf934a';
   g.beginPath();g.moveTo(cx-ww,yy+3);g.lineTo(cx,yy-7);g.lineTo(cx-ww*.3,yy-1);g.closePath();g.fill();
   g.strokeStyle='rgba(55,32,10,.5)';g.lineWidth=.9;
   g.beginPath();g.moveTo(cx-ww,yy+3);g.lineTo(cx,yy-7);g.lineTo(cx+ww,yy+3);g.stroke();}}
 g.fillStyle='rgba(50,84,20,.32)';g.fillRect(cx-tw*.22,by-h,1.8,h*.88);
 g.fillStyle='rgba(255,255,200,.25)';g.fillRect(cx+tw*.3,by-h,1.5,h*.84);
 /* ใบ */
 const nMax=Math.min(9,2+Math.round(gr*7)),L=h*1.02+13,W=h*.152+5;
 for(let i=0;i<nMax;i++){
  const sd=i%2?1:-1,k=i/8;
  const base=(i<2)?.10+k*.22:(.38+k*.98);
  const a=sd*base+(hash(i*13,7)-.5)*.12;
  const len=L*(.66+.34*(1-k*.5));
  bananaLeaf(g,cx,by-h+1+i*1.7,len*sd,W,sd>0?a:Math.PI-a,i%2);}
 /* ยอดอ่อน */
 g.fillStyle=LF_OUT;g.beginPath();g.moveTo(cx-3.4,by-h+4);g.lineTo(cx,by-h-h*.3-7);g.lineTo(cx+3.4,by-h+4);g.closePath();g.fill();
 g.fillStyle='#9fe45c';g.beginPath();g.moveTo(cx-1.7,by-h+3);g.lineTo(cx,by-h-h*.28-5);g.lineTo(cx+1.7,by-h+3);g.closePath();g.fill();
 /* เครือ + ปลี */
 if(stage>=5)bananaBunch(g,cx+tw*2.3+6,by-h+h*.36,rp,cl(h/72,.55,1));}
const TC=new Map();
function treeImg(stage,hq,rq){
 const key=stage+'|'+hq+'|'+rq;let c=TC.get(key);if(c)return c;
 const h=hq,CW=Math.ceil(h*2.5+90),CH=Math.ceil(h*1.45+95);
 c=document.createElement('canvas');c.width=CW;c.height=CH;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 c.bx=Math.round(CW/2);c.by=CH-32;
 drawTreeRaw(g,c.bx,c.by,h,stage,rq/10);
 if(TC.size>110)TC.clear();
 TC.set(key,c);return c;}
function tree(g,cx,by,pl,t){
 if(pl.stage===0)return;
 const hRaw=TH[pl.stage]+(pl.stage<5?(TH[pl.stage+1]-TH[pl.stage])*pl.prog:0);
 const hq=Math.max(8,Math.round(hRaw/3)*3);
 const rp=pl.stage===6?1:cl(pl.rp/RIPEN,0,.9);
 const rq=pl.stage>=5?Math.round(rp*10):0;
 const img=treeImg(pl.stage,hq,rq);
 const sway=Math.round(Math.sin(t*1.05+cx*.13)*(hq*.022));
 g.drawImage(img,Math.round(cx-img.bx+sway),Math.round(by-img.by));
 if(pl.stage>=1&&pl.stage<=4){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(cx-12,by+3,24,5);
  g.fillStyle=pl.water>.15?'#6ee27a':'#ffd86b';g.fillRect(cx-11,by+4,22*pl.prog,3);
  if(pl.water<=.15){g.fillStyle='#7fd0ff';g.fillRect(cx-16,by+2,3,6);g.fillRect(cx-17,by+4,5,2);}}
 else if(pl.stage===5){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(cx-14,by+3,28,5);
  g.fillStyle='#ffb03a';g.fillRect(cx-13,by+4,26*cl(pl.rp/RIPEN,0,1),3);}
 else if(pl.stage===6){const b=.6+Math.sin(t*4)*.4;
  g.fillStyle='rgba(255,216,107,'+b+')';g.fillRect(cx-4,by+3,8,5);}}

function exitArrow(g,e,t){const a=.38+Math.sin(t*3.2)*.3,r=e.r,cx=r[0]+r[2]/2,cy=r[1]+r[3]/2,s=7;
 g.save();g.globalAlpha=cl(a,0,1);g.fillStyle='#fff3c4';g.beginPath();
 if(e.d==='left'){g.moveTo(cx-s,cy);g.lineTo(cx+s,cy-s);g.lineTo(cx+s,cy+s);}
 else if(e.d==='right'){g.moveTo(cx+s,cy);g.lineTo(cx-s,cy-s);g.lineTo(cx-s,cy+s);}
 else if(e.d==='up'){g.moveTo(cx,cy-s);g.lineTo(cx-s,cy+s);g.lineTo(cx+s,cy+s);}
 else{g.moveTo(cx,cy+s);g.lineTo(cx-s,cy-s);g.lineTo(cx+s,cy-s);}
 g.closePath();g.fill();g.restore();}

 else if(mg.s==='cut'){mg.cp+=mg.cd*dt*1.15;

 tap=false;}

/*=============== MOVEMENT ===============*/
function blocked(nx,ny){const s=SC[scene],b=s.bounds;
 if(nx<b[0]||nx>b[2]||ny<b[1]||ny>b[3])return true;
 const wi=S.ride?9:6,fx=nx-wi,fy=ny-5,fw=wi*2,fh=6;
 for(const o of s.solids)if(ov(fx,fy,fw,fh,o))return true;
 return false;}
const spd=()=>S.ride==='saleng'?114:S.ride==='bike'?92:54*(1+(S.up.boots?.25:0));
(function clampStart(){const b=SC[scene].bounds;
 P.x=cl(P.x,b[0]+8,b[2]-8);P.y=cl(P.y,b[1]+8,b[3]-8);
 if(S.ride&&SC[scene].indoor)S.ride='';})();

/*=============== UPDATE ===============*/
function update(dt){
 S.clock=(S.clock+dt/220)%1;
 if(mg){mgUpd(dt);edge=false;return;}
 if(trans){trans.t+=dt*1.7;
  if(trans.t>=.5&&trans.to){scene=trans.to;P.x=trans.x;P.y=trans.y;P.dir='down';trans.to=null;
   exitLock=true;relabel();hud();save();}
  if(trans.t>=1)trans=null;edge=false;return;}
 S.plots.forEach((pl,i)=>{const auto=S.up.sprink>=2||(S.up.sprink===1&&i<4);
  if(auto)pl.water=1;else if(pl.water>0)pl.water=Math.max(0,pl.water-dt/26);
  if(pl.stage>=1&&pl.stage<=4){const m=(pl.water>.15?1.7:1)*(1+.25*S.up.fert);
   pl.prog+=dt/ST[pl.stage]*m;if(pl.prog>=1){pl.prog=0;pl.stage++;if(pl.stage===5)pl.rp=0;}}
  else if(pl.stage===5){pl.rp+=dt*(1+.12*S.up.fert);
   if(pl.rp>=RIPEN){pl.stage=6;pl.rp=RIPEN;if(scene==='orchard')sfx.ripe();}}});
 const nR=3+(S.up.racks?3:0);
 S.racks.forEach((r,i)=>{if(i<nR&&r.item===1&&r.prog<1)r.prog=Math.min(1,r.prog+dt/18);});
 drops.forEach(d=>{d.l-=dt;d.y+=dt*44;});drops=drops.filter(d=>d.l>0);
 dust.forEach(d=>d.l-=dt);dust=dust.filter(d=>d.l>0);
 if(busy){busy.t+=dt;if(busy.t>=busy.d){busy.f();busy=null;qTick();}edge=false;return;}
 if(pk){edge=false;return;}
 let vx=0,vy=0;
 const up=keys.KeyW||keys.ArrowUp||td.up,dn=keys.KeyS||keys.ArrowDown||td.down;
 const lf=keys.KeyA||keys.ArrowLeft||td.left,rt=keys.KeyD||keys.ArrowRight||td.right;
 if(up)vy--;if(dn)vy++;if(lf)vx--;if(rt)vx++;
 P.moving=!!(vx||vy);
 if(P.moving){
  const held={up:up,down:dn,left:lf,right:rt};let face=null;
  for(let i=dirStack.length-1;i>=0;i--){if(held[dirStack[i]]){face=dirStack[i];break;}}
  if(!face)face=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up');
  P.dir=face;
  const m=Math.hypot(vx,vy)||1;vx/=m;vy/=m;
  const s=spd()*dt,nx=P.x+vx*s,ny=P.y+vy*s;
  if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny;
  P.anim+=dt;wheel+=dt*(S.ride?11:0);
  if(S.ride&&Math.random()<.3)dust.push({x:P.x-(P.dir==='right'?10:-10),y:P.y,l:.42});}
 else P.anim=0;
 const inEx=SC[scene].exits.find(e=>ov(P.x-7,P.y-7,14,9,e.r));
 if(exitLock){if(!inEx)exitLock=false;}
 else if(inEx){go(inEx.to,inEx.sx,inEx.sy);toast('🚪 ไป '+SCNAME[inEx.to]);}
 const a=near();
 if(a){promptEl.classList.add('on');promptEl.innerHTML='<kbd>'+(isTouch?'A':'E')+'</kbd> '+a.txt;if(edge&&a.act)a.act();}
 else if(S.ride){promptEl.classList.add('on');
  promptEl.innerHTML='<kbd>'+(isTouch?'A':'E')+'</kbd> ลงจาก'+VNAME[S.ride];if(edge)dismount();}
 else promptEl.classList.remove('on');
 edge=false;hud();qTick();}

  S.plots.forEach((pl,i)=>{const p=PLOTS[i];L.push({y:p[1],f:()=>tree(ctx,p[0],p[1],pl,t)});});
  L.push({y:218,f:()=>tank(ctx,297,218)});
  L.push({y:150,f:()=>scarecrow(ctx,241,150)});}
 else if(scene==='backyard'){const n=3+(S.up.racks?3:0);
  for(let i=0;i<n;i++){const r=RACKS[i];L.push({y:r[1]+22,f:()=>rack(ctx,r[0],r[1],S.racks[i])});}
  L.push({y:186,f:()=>{ctx.fillStyle='#9a7440';ctx.fillRect(24,170,26,14);ctx.fillStyle='#b78d55';ctx.fillRect(24,170,26,4);
   for(let i=0;i<Math.min(6,S.inv.slice);i++){ctx.fillStyle='#e8d98a';ctx.beginPath();ctx.ellipse(29+i*4,168,3,2,0,0,7);ctx.fill();}}});}
 else if(scene==='market'){
  L.push({y:102,f:()=>drawNPC(ctx,214,102,NPCDEF.vendorF,t,1)});
  L.push({y:102,f:()=>drawNPC(ctx,278,102,NPCDEF.vendorM,t,2)});
  const cx1=130+Math.sin(t*.45)*54;
  L.push({y:238,f:()=>drawNPC(ctx,cx1,238,NPCDEF.customer,t,3)});
  L.push({y:244,f:()=>drawNPC(ctx,392,244,NPCDEF.kid,t,4,1)});}
 else if(scene==='coop'){
  L.push({y:90,f:()=>drawNPC(ctx,152,90,NPCDEF.clerk,t,5)});
  L.push({y:214,f:()=>drawNPC(ctx,320,214,NPCDEF.customer,t,6)});}
 else if(scene==='kitchen'){
  ctx.fillStyle='rgba(255,140,60,'+(.26+Math.sin(t*9)*.1)+')';ctx.beginPath();ctx.ellipse(182,122,15+Math.sin(t*7)*2,5,0,0,7);ctx.fill();
  L.push({y:130,f:()=>{for(let i=0;i<Math.min(4,S.inv.roll);i++){ctx.fillStyle='#e0b95f';ctx.fillRect(256+i*11,104,9,13);
   ctx.fillStyle='#caa044';ctx.fillRect(256+i*11,104,9,4);}}});}
 ['bike','saleng'].forEach(v=>{if(S.up[v]&&S.ride!==v&&S.park[v].sc===scene){
  const pp=S.park[v];L.push({y:pp.y,f:()=>drawVehicle(ctx,v,pp.x,pp.y,'right',0)});}});
 dust.forEach(d=>{ctx.fillStyle='rgba(212,192,152,'+d.l+')';ctx.fillRect(d.x-2,d.y-1,3,2);});
 drops.forEach(d=>{ctx.fillStyle='rgba(127,208,255,'+cl(d.l*2,0,.9)+')';ctx.fillRect(d.x,d.y,1,3);});
 L.push({y:P.y+.5,f:player});
 L.sort((a,b)=>a.y-b.y).forEach(o=>o.f(ctx));
 SC[scene].exits.forEach(e=>exitArrow(ctx,e,t));
 const tn=SC[scene].out?tint():'rgba(255,198,116,.08)';
 if(tn){ctx.fillStyle=tn;ctx.fillRect(0,0,VW,VH);}
 if(SC[scene].dim){const v2=ctx.createRadialGradient(P.x,P.y-12,20,P.x,P.y-12,180);
  v2.addColorStop(0,'rgba(255,220,150,.10)');v2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=v2;ctx.fillRect(0,0,VW,VH);}
 const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.34,VW/2,VH/2,VH*.96);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.36)');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
 if(busy){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(VW/2-50,VH-44,100,10);
  ctx.fillStyle='#ffd86b';ctx.fillRect(VW/2-48,VH-42,96*(busy.t/busy.d),6);
  promptEl.classList.add('on');promptEl.textContent=busy.l;}
 if(mg)mgDraw(ctx);
 if(trans){const a=1-Math.abs(trans.t*2-1);ctx.fillStyle='rgba(3,5,8,'+cl(a,0,1)+')';ctx.fillRect(0,0,VW,VH);}}

/*=============== LOOP ===============*/
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt);render(T);requestAnimationFrame(loop);}
relabel();hud();qTick();requestAnimationFrame(loop);
setTimeout(()=>toast('🌿 เดินลงใต้ตามถนน → เข้าสวนกล้วยแปลงใหม่'),700);
setTimeout(()=>toast('📱 มือถือ: ปุ่มทิศซ้ายล่าง • A = โต้ตอบ • ⛶ เต็มจอ'),2700);
</script>
