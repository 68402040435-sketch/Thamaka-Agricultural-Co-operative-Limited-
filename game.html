function ov(ax,ay,aw,ah,r){return ax<r[0]+r[2]&&ax+aw>r[0]&&ay<r[1]+r[3]&&ay+ah>r[1];}
function mixc(a,b,t){return'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}

function snd(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,AC.currentTime);
 g.gain.setValueAtTime(v||.045,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}

 const x=c.getContext('2d');for(let j=0;j<h;j++)for(let i=0;i<w;i++){const q=PAL[rows[j][i]];if(q){x.fillStyle=q;x.fillRect(i,j,1,1);}}return c;}

 const x=c.getContext('2d');x.translate(c0.width,0);x.scale(-1,1);x.drawImage(c0,0,0);return c;}

/*========================= TEXTURE HELPERS =========================*/
function grass(g,x,y,w,h){g.fillStyle='#58a340';g.fillRect(x,y,w,h);
 for(let j=y;j<y+h;j+=4)for(let i=x;i<x+w;i+=4){const r=hash(i,j);

 mguiEl.classList.add('on');mgTxt();}
function mgTxt(){if(!mg||mg.s==='res')return;
 const T={pour:['① เทแป้งเป็นวงกลม','กด [Space/A] ตอนแป้งแผ่พอดีเส้นประ'],
  roll:['② ม้วนทองม้วน','รัวปุ่ม [Space/A] เร็ว ๆ ให้เต็มก่อนหมดเวลา!'],
  cut:['③ ตัดให้พอดี','กด [Space/A] ตอนมีดอยู่โซนเขียว ('+mg.cuts.length+'/3)'],
  pack:['④ ใส่บรรจุภัณฑ์','กด [Space/A] เพื่อแพ็คใส่กล่อง']}[mg.s];
 mgtEl.textContent=T[0];mgdEl.textContent=T[1];}
function mgUpd(dt){mg.t+=dt;
 if(mg.s==='pour'){mg.pour+=dt*.62;
  if(tap||mg.pour>1.36){mg.pq=cl(1-Math.abs(mg.pour-.92)/.38,0,1);mg.s='roll';mg.rt=4;snd(520,.1);mgTxt();}}
 else if(mg.s==='roll'){mg.rt-=dt;
  if(tap){mg.roll=Math.min(1.2,mg.roll+.085);snd(300+mg.roll*500,.04,'triangle',.03);}
  if(mg.rt<=0||mg.roll>=1){mg.rq=cl(mg.roll,0,1);mg.s='cut';snd(620,.1);mgTxt();}}
 else if(mg.s==='cut'){mg.cp+=mg.cd*dt*1.15;
  if(mg.cp>1){mg.cp=1;mg.cd=-1;}if(mg.cp<0){mg.cp=0;mg.cd=1;}
  if(tap){const s=cl(1-Math.abs(mg.cp-.5)/.24,0,1);mg.cuts.push(s);
   snd(s>.6?880:220,.08,s>.6?'square':'sawtooth');if(mg.cuts.length>=3)mg.s='pack';mgTxt();}}
 else if(mg.s==='pack'){if(tap)mgDone();}
 else if(mg.s==='res'){if(tap){mg=null;mguiEl.classList.remove('on');save();qTick();return;}}
 tap=false;}
function mgDone(){const cs=mg.cuts.reduce((a,b)=>a+b,0)/3,q=cl((mg.pq+mg.rq+cs)/3,0,1);
 let n=Math.max(2,Math.round(3+q*3));if(S.up.pan)n=Math.round(n*1.5);
 S.inv.roll+=n;S.stats.roll+=n;mg.s='res';sfx.coin();hud();
 const st=Math.max(1,Math.round(q*5));
 mgtEl.textContent='✨ ได้ทองม้วน '+n+' กล่อง!';
 mgdEl.textContent='คุณภาพ '+'★'.repeat(st)+'☆'.repeat(5-st)+' — กด [Space/A] เพื่อปิด';}
function mgDraw(g){g.fillStyle='rgba(5,8,13,.74)';g.fillRect(0,0,VW,VH);const cx=VW/2,cy=164;
 if(mg.s==='pour'){
  g.fillStyle='#2a2f36';g.beginPath();g.ellipse(cx,cy,68,31,0,0,7);g.fill();
  g.fillStyle='#3d444d';g.beginPath();g.ellipse(cx,cy-2,64,28,0,0,7);g.fill();
  g.setLineDash([4,4]);g.strokeStyle='#7fd0ff';g.lineWidth=1.5;
  g.beginPath();g.ellipse(cx,cy-2,55,24,0,0,7);g.stroke();g.setLineDash([]);
  const r=Math.min(74,8+mg.pour*58);
  g.fillStyle=mg.pour>1.12?'#c98a3a':'#f0d68a';g.beginPath();g.ellipse(cx,cy-2,r,r*.44,0,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(cx-r*.3,cy-9,r*.3,r*.12,0,0,7);g.fill();
  g.fillStyle='#8a99a6';g.fillRect(cx-3,54,6,34);g.fillStyle='#c9d4de';g.fillRect(cx-9,44,18,12);}
 else if(mg.s==='roll'){
  g.fillStyle='#3d444d';g.beginPath();g.ellipse(cx,cy,66,29,0,0,7);g.fill();const p=cl(mg.roll,0,1);
  g.fillStyle='#f0d68a';g.beginPath();g.ellipse(cx+p*18,cy-2,58-p*38,25-p*7,0,0,7);g.fill();
  g.fillStyle='#e0b95f';g.fillRect(cx-58,cy-14,Math.max(4,p*72),22);
  g.fillStyle='#caa044';g.fillRect(cx-58,cy-14,Math.max(4,p*72),4);
  g.fillStyle='#9a7440';g.fillRect(cx-64,cy-16,6,26);
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(cx-70,216,140,12);g.fillStyle='#6ee27a';g.fillRect(cx-68,218,136*p,8);
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(cx-70,233,140,6);g.fillStyle='#ff8f5a';g.fillRect(cx-69,234,138*cl(mg.rt/4,0,1),4);}
 else if(mg.s==='cut'){
  g.fillStyle='#8a6238';g.fillRect(cx-82,cy-6,164,28);g.fillStyle='#a3763f';g.fillRect(cx-82,cy-6,164,6);
  for(let i=0;i<3;i++){const s=mg.cuts[i];
   g.fillStyle=s==null?'#e0b95f':(s>.6?'#f5dd97':'#c98a3a');g.fillRect(cx-68+i*47,cy-16,42,16);
   g.fillStyle='rgba(255,255,255,.25)';g.fillRect(cx-68+i*47,cy-16,42,4);}
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(cx-80,204,160,16);
  g.fillStyle='#2e7d4f';g.fillRect(cx-80+160*.26,204,160*.48,16);
  g.fillStyle='#6ee27a';g.fillRect(cx-80+160*.38,204,160*.24,16);
  const mx=cx-80+160*mg.cp;g.fillStyle='#e8eef5';g.fillRect(mx-2,196,4,30);g.fillStyle='#b7c3cf';g.fillRect(mx-1,196,1,30);}
 else{g.fillStyle='#c9762f';g.fillRect(cx-48,cy-18,96,46);g.fillStyle='#e08b3c';g.fillRect(cx-48,cy-18,96,10);
  g.fillStyle='#fff6dd';g.fillRect(cx-34,cy-4,68,20);
  for(let i=0;i<4;i++){g.fillStyle='#e0b95f';g.fillRect(cx-30+i*17,cy-2,13,16);
   g.fillStyle='#caa044';g.fillRect(cx-30+i*17,cy-2,13,4);}
  g.fillStyle='#ffd86b';g.fillRect(cx-22,cy-16,44,6);
  if(mg.s==='res')for(let i=0;i<12;i++){const a=mg.t*2.2+i;
   g.fillStyle=['#ffd86b','#6ee27a','#7fd0ff','#ff9ec4'][i%4];
   g.fillRect(cx+Math.cos(a)*(52+i*4),cy+Math.sin(a*1.3)*(40+i*2),3,3);}}}

/*========================= HUD =========================*/
function hud(){hudEl.innerHTML='';
 const c=(t,cls)=>{const d=document.createElement('div');d.className='chip'+(cls||'');d.innerHTML=t;hudEl.appendChild(d);};
 c('📍 '+SCNAME[scene],' place');c('💰 <b>'+S.money+'</b>฿');
 c('🍌 สุก <b>'+S.inv.ripe+'</b>');c('🌿 ดิบ <b>'+S.inv.green+'</b>');
 if(S.inv.slice)c('🔪 หั่น <b>'+S.inv.slice+'</b>');
 if(S.inv.dried)c('☀️ ตาก <b>'+S.inv.dried+'</b>');
 if(S.inv.flour)c('🥣 แป้ง <b>'+S.inv.flour+'</b>');
 if(S.inv.roll)c('🥠 ทองม้วน <b>'+S.inv.roll+'</b>');}

/*========================= MOVEMENT =========================*/
function blocked(nx,ny){const s=SC[scene],b=s.bounds;
 if(nx<b[0]||nx>b[2]||ny<b[1]||ny>b[3])return true;
 const fx=nx-5,fy=ny-4,fw=10,fh=5;
 for(const o of s.solids)if(ov(fx,fy,fw,fh,o))return true;
 return false;}
const spd=()=>52*(1+(S.up.boots?.25:0)+(S.up.vehicle?.35:0));

/*========================= UPDATE =========================*/
function update(dt){
 S.clock=(S.clock+dt/220)%1;
 if(mg){mgUpd(dt);edge=false;return;}
 if(trans){trans.t+=dt*1.7;
  if(trans.t>=.5&&trans.to){scene=trans.to;P.x=trans.x;P.y=trans.y;P.dir='down';trans.to=null;cool=.7;relabel();hud();save();}
  if(trans.t>=1)trans=null;edge=false;return;}
 if(cool>0)cool-=dt;
 /* การเติบโต + การสุก */
 S.plots.forEach((pl,i)=>{const auto=S.up.sprink>=2||(S.up.sprink===1&&i<4);
  if(auto)pl.water=1;else if(pl.water>0)pl.water=Math.max(0,pl.water-dt/26);
  if(pl.stage>=1&&pl.stage<=4){const m=(pl.water>.15?1.7:1)*(1+.25*S.up.fert);
   pl.prog+=dt/ST[pl.stage]*m;if(pl.prog>=1){pl.prog=0;pl.stage++;if(pl.stage===5)pl.rp=0;}}
  else if(pl.stage===5){pl.rp+=dt*(1+.12*S.up.fert);
   if(pl.rp>=RIPEN){pl.stage=6;pl.rp=RIPEN;if(scene==='farm')sfx.ripe();}}});
 const nR=3+(S.up.racks?3:0);
 S.racks.forEach((r,i)=>{if(i<nR&&r.item===1&&r.prog<1)r.prog=Math.min(1,r.prog+dt/18);});
 drops.forEach(d=>{d.l-=dt;d.y+=dt*44;});drops=drops.filter(d=>d.l>0);
 dust.forEach(d=>d.l-=dt);dust=dust.filter(d=>d.l>0);
 if(busy){busy.t+=dt;if(busy.t>=busy.d){busy.f();busy=null;qTick();}edge=false;return;}
 if(pk){edge=false;return;}
 let vx=0,vy=0;
 if(keys['KeyW']||keys['ArrowUp']||td.u)vy--;if(keys['KeyS']||keys['ArrowDown']||td.d)vy++;
 if(keys['KeyA']||keys['ArrowLeft']||td.l)vx--;if(keys['KeyD']||keys['ArrowRight']||td.r)vx++;
 P.moving=!!(vx||vy);
 if(P.moving){const m=Math.hypot(vx,vy)||1;vx/=m;vy/=m;
  P.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up');
  const s=spd()*dt,nx=P.x+vx*s,ny=P.y+vy*s;
  if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny;P.anim+=dt;
  if(S.up.vehicle&&Math.random()<.25)dust.push({x:P.x,y:P.y,l:.4});}
 else P.anim=0;
 if(cool<=0)for(const e of SC[scene].exits){
  if(ov(P.x-5,P.y-5,10,7,e.r)){go(e.to,e.sx,e.sy);toast('🚪 ไป '+SCNAME[e.to]);break;}}
 const a=near();
 if(a){promptEl.classList.add('on');promptEl.innerHTML='<kbd>E</kbd> '+a.txt;if(edge&&a.act)a.act();}
 else promptEl.classList.remove('on');
 edge=false;hud();qTick();}

/*========================= RENDER =========================*/
function tint(){const c=S.clock;
 if(c<.06)return'rgba(28,38,88,.42)';if(c<.16)return'rgba(255,150,90,.20)';
 if(c<.62)return null;if(c<.74)return'rgba(255,130,70,.22)';
 if(c<.84)return'rgba(58,58,138,.30)';return'rgba(24,30,76,.44)';}
function render(t){
 ctx.drawImage(BG(scene),0,0);
 const L=[];
 if(scene==='farm'){
  for(let i=0;i<3;i++){const x=(t*10+i*190)%560-40,y=12+i*8;
   ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.ellipse(x,y,20,6,0,0,7);ctx.fill();
   ctx.beginPath();ctx.ellipse(x+12,y-3,12,5,0,0,7);ctx.fill();}
  S.plots.forEach((pl,i)=>{const p=PLOTS[i];L.push({y:p[1],f:()=>tree(ctx,p[0],p[1],pl,t)});});
  if(S.up.vehicle)L.push({y:200,f:()=>bike(ctx,120,200)});}
 else if(scene==='backyard'){const n=3+(S.up.racks?3:0);
  for(let i=0;i<n;i++){const r=RACKS[i];L.push({y:r[1]+22,f:()=>rack(ctx,r[0],r[1],S.racks[i],t)});}
  L.push({y:186,f:()=>{ctx.fillStyle='#9a7440';ctx.fillRect(24,170,26,14);ctx.fillStyle='#b78d55';ctx.fillRect(24,170,26,4);
   for(let i=0;i<Math.min(6,S.inv.slice);i++){ctx.fillStyle='#e8d98a';ctx.beginPath();ctx.ellipse(29+i*4,168,3,2,0,0,7);ctx.fill();}}});}
 else if(scene==='market'){L.push({y:104,f:()=>npc(ctx,212,102,'#e24a4a',t)});L.push({y:104,f:()=>npc(ctx,278,102,'#4a90d9',t)});
  L.push({y:236,f:()=>npc(ctx,330,234,'#ffd86b',t)});}
 else if(scene==='coop'){L.push({y:92,f:()=>npc(ctx,146,90,'#6ee27a',t)});}
 else if(scene==='kitchen'){
  ctx.fillStyle='rgba(255,140,60,'+(.26+Math.sin(t*9)*.1)+')';ctx.beginPath();ctx.ellipse(182,122,15+Math.sin(t*7)*2,5,0,0,7);ctx.fill();
  L.push({y:130,f:()=>{for(let i=0;i<Math.min(4,S.inv.roll);i++){ctx.fillStyle='#e0b95f';ctx.fillRect(256+i*11,104,9,13);
   ctx.fillStyle='#caa044';ctx.fillRect(256+i*11,104,9,4);}}});}
 dust.forEach(d=>{ctx.fillStyle='rgba(212,192,152,'+d.l+')';ctx.fillRect(d.x-2,d.y-1,3,2);});
 drops.forEach(d=>{ctx.fillStyle='rgba(127,208,255,'+cl(d.l*2,0,.9)+')';ctx.fillRect(d.x,d.y,1,3);});
 L.push({y:P.y,f:player});
 L.sort((a,b)=>a.y-b.y).forEach(o=>o.f(ctx));
 SC[scene].exits.forEach(e=>exitArrow(ctx,e,t));
 const tn=SC[scene].out?tint():'rgba(255,198,116,.08)';
 if(tn){ctx.fillStyle=tn;ctx.fillRect(0,0,VW,VH);}
 if(SC[scene].dim){const v2=ctx.createRadialGradient(P.x,P.y-10,20,P.x,P.y-10,180);
  v2.addColorStop(0,'rgba(255,220,150,.10)');v2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=v2;ctx.fillRect(0,0,VW,VH);}
 const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.34,VW/2,VH/2,VH*.96);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.36)');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
 if(busy){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(VW/2-50,VH-44,100,10);
  ctx.fillStyle='#ffd86b';ctx.fillRect(VW/2-48,VH-42,96*(busy.t/busy.d),6);
  promptEl.classList.add('on');promptEl.textContent=busy.l;}
 if(mg)mgDraw(ctx);
 if(trans){const a=1-Math.abs(trans.t*2-1);ctx.fillStyle='rgba(3,5,8,'+cl(a,0,1)+')';ctx.fillRect(0,0,VW,VH);}}

/*========================= LOOP =========================*/
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt);render(T);requestAnimationFrame(loop);}
relabel();hud();qTick();requestAnimationFrame(loop);
setTimeout(()=>toast('🌴 ยินดีต้อนรับ! เดินตามถนนดิน เข้าประตูรั้วไปแปลงกล้วย'),600);
setTimeout(()=>toast('🌿→🍌 เก็บดิบได้เลย หรือรอ '+RIPEN+' วิ ให้สุกขายแพงกว่า'),2600);
</script>
</body>
